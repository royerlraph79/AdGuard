name: Update Blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔎 Validate inputs
        run: |
          test -f convert_hosts.py
          test -f sources.txt

          echo "== Sources file =="
          sed -n '1,40p' sources.txt

          SOURCE_COUNT=$(grep -cve '^\s*$' -e '^\s*[#!;]' sources.txt || true)
          echo "Source count: $SOURCE_COUNT"

          if [ "$SOURCE_COUNT" -eq 0 ]; then
            echo "No usable sources found in sources.txt"
            exit 1
          fi

      - name: ⚙️ Generate blocklist
        run: |
          echo "📍 STARTING convert_hosts.py"
          python convert_hosts.py \
            --source sources.txt \
            --output adguard_blocklist.txt \
            --wildcardize-keywords \
            --keyword-threshold 5 \
            --collapse-registrable \
            --threads 16 \
            -v
          echo "✅ FINISHED convert_hosts.py"

      - name: 👀 Preview output
        run: |
          test -f adguard_blocklist.txt

          echo "== Header preview =="
          sed -n '1,/^$/p' adguard_blocklist.txt || true

          echo
          echo "== First rules =="
          grep -m 20 -E '^\|\|.+\^$' adguard_blocklist.txt || true

          RULES=$(grep -c -E '^\|\|.+\^$' adguard_blocklist.txt || true)
          echo "Rule count: $RULES"
          echo "### Rule count: $RULES" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RULES" -eq 0 ]; then
            echo "Generator produced zero rules"
            exit 1
          fi

      - name: ✅ Check for changes
        id: git-check
        run: |
          if git diff --quiet -- adguard_blocklist.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
            git status --porcelain
            git diff --stat -- adguard_blocklist.txt || true
          fi

      - name: 📤 Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add adguard_blocklist.txt
          git commit -m "🔄 Auto-update blocklist [skip ci]"
          git push
