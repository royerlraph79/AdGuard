name: Update Blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.14.2
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Generate blocklists (safe + aggressive)
        run: |
          echo "📍 STARTING convert_hosts.py"
          python convert_hosts.py --output-base adguard_blocklist
          echo "✅ FINISHED convert_hosts.py"

      - name: 👀 Preview output
        run: |
          echo "== Preview SAFE =="
          head -n 12 adguard_blocklist_safe.txt || true
          SAFE_RULES=$(grep -E '^\|\|.+\^$|^\|\|.+\.\^$' adguard_blocklist_safe.txt | wc -l || true)
          echo "SAFE Rule count: $SAFE_RULES"
          echo "### SAFE Rule count: $SAFE_RULES" >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "== Preview AGGRESSIVE =="
          head -n 12 adguard_blocklist_aggressive.txt || true
          AGGR_RULES=$(grep -E '^\|\|.+\^$' adguard_blocklist_aggressive.txt | wc -l || true)
          echo "AGGRESSIVE Rule count: $AGGR_RULES"
          echo "### AGGRESSIVE Rule count: $AGGR_RULES" >> "$GITHUB_STEP_SUMMARY"

      - name: ✅ Check for changes
        id: git-check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
            git status --porcelain
            git diff --stat || true
          fi

      - name: 📤 Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          git commit -m "🔄 Auto-update blocklists [skip ci]"
          git push
