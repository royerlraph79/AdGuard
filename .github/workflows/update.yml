name: Update Blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # Every 24 hours

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.14.2
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Generate blocklist
        run: |
          echo "📍 STARTING convert_hosts.py"
          python convert_hosts.py
          echo "✅ FINISHED convert_hosts.py"

      - name: 👀 Preview output
        run: |
          echo "== Desktop preview =="
          head -n 10 adguard_blocklist.txt || true

          echo "== Mobile preview =="
          head -n 10 adguard_blocklist_mobile.txt || true

          RULES=$(grep -E '^\|\|.+\^$' adguard_blocklist.txt | wc -l || true)
          MOBILE_RULES=$(grep -E '^\|\|.+\^$' adguard_blocklist_mobile.txt | wc -l || true)

          echo "Desktop rule count: $RULES"
          echo "Mobile rule count: $MOBILE_RULES"

          echo "### Desktop rules: $RULES" >> "$GITHUB_STEP_SUMMARY"
          echo "### Mobile rules: $MOBILE_RULES" >> "$GITHUB_STEP_SUMMARY"

      - name: ✅ Check for changes
        id: git-check
        run: |
          if git diff --quiet adguard_blocklist.txt adguard_blocklist_mobile.txt cache.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
            git status --porcelain
            git diff --stat adguard_blocklist.txt adguard_blocklist_mobile.txt cache.json || true
          fi

      - name: 📤 Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add adguard_blocklist.txt
          git add adguard_blocklist_mobile.txt
          git add cache.json

          git commit -m "🔄 Auto-update blocklist [skip ci]"
          git push
