name: Update Blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # 🕛 Every 24 hours

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.14.2
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.2'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ⚙️ Generate blocklist
      run: |
        echo "📍 STARTING convert_hosts.py"
        python convert_hosts.py
        echo "✅ FINISHED convert_hosts.py"

    - name: 👀 Preview output
      run: |
        echo "== Head of adguard_blocklist.txt =="
        head -n 20 adguard_blocklist.txt
        RULES=$(grep -E '^\|\|.+\^$' adguard_blocklist.txt | wc -l || true)
        echo "Rule count: $RULES"
        echo "### ✅ Rule count: $RULES" >> $GITHUB_STEP_SUMMARY

    - name: ✅ Check for changes
      id: git-check
      run: |
        if git diff --quiet adguard_blocklist.txt; then
          echo "No changes to commit."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "Changes detected in blocklist."
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: 📤 Commit and push changes
      if: steps.git-check.outputs.changed == 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add adguard_blocklist.txt
        git commit -m "🔄 Auto-update blocklist [skip ci]"
        git push