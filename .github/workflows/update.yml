name: Update Blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.14.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Generate blocklist
        run: |
          echo "📍 STARTING convert_hosts.py"
          python convert_hosts.py -v
          echo "✅ FINISHED convert_hosts.py"

      - name: 👀 Preview output
        run: |
          echo "== Header preview =="
          sed -n '1,/^$/p' adguard_blocklist.txt || true

          echo
          echo "== First rules =="
          grep -m 10 -E '^\|\|.+\^$' adguard_blocklist.txt || true

          RULES=$(grep -c -E '^\|\|.+\^$' adguard_blocklist.txt || true)

          echo "Rule count: $RULES"
          echo "### Rule count: $RULES" >> "$GITHUB_STEP_SUMMARY"

      - name: ✅ Check for changes
        id: git-check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
            git status --porcelain
            git diff --stat || true
          fi

      - name: 📤 Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add adguard_blocklist.txt convert_hosts.py .github/workflows/update.yml requirements.txt
          git commit -m "🔄 Auto-update blocklist [skip ci]"
          git push
