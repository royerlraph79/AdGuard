name: Tests

on:
  push:
    paths-ignore:
      - "adguard_blocklist.txt"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v5

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: 📦 Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🧪 Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --cov=convert_hosts --cov-report=term-missing
